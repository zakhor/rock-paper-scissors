<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>じゃんけんマンに勝てるかな？</title>
    <script src="https://ty-lab.net/shared/footer.js" defer></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #C0C0C0;
            padding: 20px;

            color: #000000;
            margin-bottom: 5px;

        .game-area {

        .left-panel {

        }

        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .avatar-score-row {

            align-items: stretch;
        }

        .ai-avatar {

        .score-label {
            color: #000000;

            font-weight: bold;
        }

        .score-value {
            font-weight: bold;

        .score-value.ai { color: #FF0000; }
        .score-value.user { color: #0000FF; }

        .buttons-section {

        .buttons {

        }

        .hand-button {

        .hand-button.selected {

        .history-section {
            background: #F0F0F0;
            padding: 15px;
            border: 2px solid #808080;
        }

        .history-section h3 {
            margin-bottom: 10px;

            background: #808080;
            padding: 5px;

        .history-table-container {

        .history-table-container.fixed-height {

        .history-table-container::-webkit-scrollbar {

        .history-table-container::-webkit-scrollbar-thumb:hover {

        .modal.active {

        .modal-content {

            text-align: center;

        .modal-content { width: calc(100% - 24px); max-height: calc(100dvh - 24px); overflow-y: auto; }

        /* Hell Mode Styles - Color Inversion */
        body.hell-mode {
            filter: invert(1) hue-rotate(180deg);

        body.hell-mode img,

            0%, 100% { opacity: 1; }

        .flash-effect {

        @media (max-width: 900px) {
            .game-area {

            .avatar-score-row {

            .ai-avatar {

            .container { padding: 10px; }

            #gameSubtitle { font-size: 13px; margin-bottom: 0 !important; }
            .game-area { margin-top: 8px; gap: 12px; }
            .left-panel { gap: 8px; min-width: 0; }
            .avatar-score-row { flex-direction: row; gap: 8px; }
            .ai-avatar { width: 72px; height: 90px; font-size: 48px; margin: 0; align-self: center; }
            .score-board { padding: 6px; min-width: 0; }
            .score-board h2 { font-size: 14px; padding: 3px; margin-bottom: 5px; }
            .scores { font-size: 13px; gap: 4px; }
            .score-label { font-size: 11px; }
            .score-value { font-size: 22px; }
            .buttons-section { padding: 8px; }
            .buttons-section h3 { font-size: 14px; margin-bottom: 6px; padding: 3px; }

            .hand-button { min-width: 0; min-height: 44px; padding: 6px 2px; font-size: 22px; line-height: 1.2; touch-action: manipulation; }
            .history-section { padding: 8px; }
            th, td { padding: 6px 3px; font-size: 12px; }
            .modal-content { padding: 20px 14px; }
            .modal-content h2 { font-size: 24px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="gameTitle">じゃんけんマンに勝てるかな？</h1>
        <p id="gameSubtitle" style="text-align: center; margin-bottom: 15px; font-weight: bold;">30本先取勝負</p>

        <div class="game-area">
            <!-- Left Panel -->
            <div class="left-panel">
                <!-- AI Avatar and Score Board -->
                <div class="avatar-score-row">
                    <div class="ai-avatar" id="aiAvatar">😀</div>
                    <div class="score-board">
                        <h2>スコア</h2>
                        <div class="scores">
                            <div class="score-item">
                                <span class="score-label">じゃんけんマン</span>
                                <span class="score-value ai" id="aiWins">0</span>
                            </div>
                            <div class="score-item">
                                <span class="score-label">あなた</span>
                                <span class="score-value user" id="userWins">0</span>
                            </div>
                            <div class="score-item">
                                <span class="score-label">あいこ</span>
                                <span class="score-value draw" id="draws">0</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- AI Buttons -->
                <div class="buttons-section">
                    <h3>じゃんけんマンの手</h3>
                    <div class="buttons">
                        <button class="hand-button" id="aiRock" disabled>グー</button>
                        <button class="hand-button" id="aiScissors" disabled>チョキ</button>
                        <button class="hand-button" id="aiPaper" disabled>パー</button>
                    </div>
                </div>

                <!-- User Buttons -->
                <div class="buttons-section">
                    <h3>あなたの手</h3>
                    <div class="buttons">
                        <button class="hand-button" id="userRock" onclick="playRound('ROCK')">グー<br><span style="font-size: 0.4em;">(1/R)</span></button>
                        <button class="hand-button" id="userScissors" onclick="playRound('SCISSORS')">チョキ<br><span style="font-size: 0.4em;">(2/S)</span></button>
                        <button class="hand-button" id="userPaper" onclick="playRound('PAPER')">パー<br><span style="font-size: 0.4em;">(3/P)</span></button>
                    </div>
                </div>
            </div>

            <!-- Right Panel -->
            <div class="right-panel">
                <!-- History Table -->
                <div class="history-section">
                    <h3>ハンド履歴</h3>
                    <div class="history-table-container fixed-height">
                        <table>
                            <thead>
                                <tr>
                                    <th>回数</th>
                                    <th>じゃんけんマンの手</th>
                                    <th>あなたの手</th>
                                    <th>勝敗</th>
                                </tr>
                            </thead>
                            <tbody id="historyTable">
                                <tr><td colspan="4">まだ対戦履歴がありません</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Session Stats -->
                <div class="history-section">
                    <h3>セッション記録</h3>
                    <div style="background: white; border: 2px solid black; padding: 15px; margin-bottom: 10px;">
                        <div style="text-align: center; font-size: 1.1em;">
                            <strong>総合勝率:</strong> <span id="totalWinRate" style="font-family: 'Courier New', monospace; font-size: 1.3em; color: #0000FF; font-weight: bold;">0%</span>
                            <span style="font-size: 0.9em; color: #808080; margin-left: 10px;">(<span id="sessionWins">0</span>勝 <span id="sessionLosses">0</span>敗)</span>
                        </div>
                    </div>
                    <div class="history-table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>セッション</th>
                                    <th>勝ち</th>
                                    <th>負け</th>
                                    <th>あいこ</th>
                                </tr>
                            </thead>
                            <tbody id="sessionTable">
                                <tr><td colspan="4">まだセッション記録がありません</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="site-footer">
        <p data-copyright data-start="2025">© 2025-2026 T.Y. <a href="mailto:admin@ty-lab.net">admin@ty-lab.net</a></p>
    </footer>

    <!-- Game End Modal -->
    <div class="modal" id="gameEndModal">
        <div class="modal-content">
            <h2 id="modalTitle">ゲーム終了</h2>
            <p id="modalMessage"></p>
            <div class="modal-actions">
                <button class="reset-button" id="shareButton" onclick="shareResult()">結果をシェア</button>
                <button class="reset-button" onclick="resetGame()">もう一度プレイ</button>
            </div>
            <p id="shareStatus" role="status" aria-live="polite"></p>
            <textarea id="shareText" aria-label="共有する結果（コピー用）" readonly hidden></textarea>
        </div>
    </div>

    <script>
        // Game State
        const HANDS = {
            ROCK: 'ROCK',
            PAPER: 'PAPER',
            SCISSORS: 'SCISSORS'
        };

        const HAND_SYMBOLS = {
            ROCK: 'グー',
            PAPER: 'パー',
            SCISSORS: 'チョキ'
        };

        const HAND_NAMES = {
            ROCK: 'グー',
            PAPER: 'パー',
            SCISSORS: 'チョキ'
        };

        const HELL_MODE_THRESHOLD = 30; // Player must reach this to enter Hell Mode
        const HELL_MODE_TARGET = 40; // Player must reach this to win in Hell Mode
        const AI_WIN_THRESHOLD = 30; // AI always wins at 30

        let gameState = {
            round: 0,
            aiWins: 0,
            userWins: 0,
            draws: 0,
            history: [], // { round, aiHand, userHand, result }
            userHandHistory: [], // For pattern prediction
            aiHandHistory: [], // AI's hand history
            historyDependency: {}, // For history-dependent prediction
            ngramTable: {}, // For pattern prediction
            nextAIHand: null, // Pre-calculated next AI hand
            isHellMode: false // Hell Mode flag
        };

        let sessionHistory = []; // Array of { sessionNumber, userWins, aiWins, draws, winRate }

        // Initialize game
        function initGame() {
            initHistoryDependency();
            prepareNextAIHand(); // Calculate first AI hand
            updateSessionTable();
        }

        function initHistoryDependency() {
            const hands = ['R', 'P', 'S'];
            for (let ai of hands) {
                for (let user of hands) {
                    const key = `${ai}_${user}`;
                    gameState.historyDependency[key] = { ROCK: 0, PAPER: 0, SCISSORS: 0 };
                }
            }
        }

        // Main game logic
        function playRound(userHand) {
            if (gameState.aiWins >= AI_WIN_THRESHOLD || gameState.userWins >= HELL_MODE_TARGET) return;
            gameState.round++;

            // Use pre-calculated AI hand
            const aiHand = gameState.nextAIHand;

            // Determine result
            const result = determineWinner(aiHand, userHand);

            // Update scores
            if (result === 'AI_WIN') {
                gameState.aiWins++;
            } else if (result === 'USER_WIN') {
                gameState.userWins++;
            } else {
                gameState.draws++;
            }

            // Add to history
            gameState.history.push({
                round: gameState.round,
                aiHand: aiHand,
                userHand: userHand,
                result: result
            });

            // Learn from this round
            learnFromRound(aiHand, userHand);

            // Update UI
            updateScores();
            updateButtons(aiHand, userHand);
            updateAIAvatar(result);
            updateHistoryTable();

            // Check for Hell Mode transition
            if (gameState.userWins === HELL_MODE_THRESHOLD && !gameState.isHellMode) {
                enterHellMode();
            }

            // Check for game end
            if (gameState.aiWins >= AI_WIN_THRESHOLD || gameState.userWins >= HELL_MODE_TARGET) {
                setTimeout(() => showGameEndModal(), 500);
            } else {
                // Prepare next AI hand for next round
                prepareNextAIHand();
            }
        }

        function prepareNextAIHand() {
            // First round: random
            if (gameState.round === 0) {
                gameState.nextAIHand = randomHand();
                return;
            }

            // Get predictions
            const historyPrediction = predictByHistory();
            const patternPrediction = predictByPattern();

            // Decide strategy
            if (historyPrediction === null && patternPrediction === null) {
                gameState.nextAIHand = randomHand();
            } else if (historyPrediction === patternPrediction && historyPrediction !== null) {
                // Both agree: play winning hand
                gameState.nextAIHand = getWinningHand(historyPrediction);
            } else {
                // Disagreement: play non-losing hand
                gameState.nextAIHand = getNonLosingHand(historyPrediction, patternPrediction);
            }
        }

        function predictByHistory() {
            if (gameState.history.length === 0) {
                return null;
            }

            const lastRound = gameState.history[gameState.history.length - 1];
            const lastAI = handToShort(lastRound.aiHand);
            const lastUser = handToShort(lastRound.userHand);
            const key = `${lastAI}_${lastUser}`;

            const counts = gameState.historyDependency[key];
            if (!counts) {
                return null;
            }

            return findMaxHand(counts);
        }

        function predictByPattern() {
            const votes = { ROCK: 0, PAPER: 0, SCISSORS: 0 };

            // Check 0-gram (no context) first
            const zeroGramKey = '0:';
            const zeroGramHands = gameState.ngramTable[zeroGramKey];
            if (zeroGramHands) {
                const maxHand = findMaxHand(zeroGramHands);
                if (maxHand) {
                    const hitCount = zeroGramHands[maxHand];
                    const voteWeight = hitCount * 0.5;  // 0-gram gets half weight
                    votes[maxHand] += voteWeight;
                }
            }

            // Regular n-gram patterns (1 to 5)
            if (gameState.userHandHistory.length > 0) {
                for (let patternLen = 1; patternLen <= 5; patternLen++) {
                    if (gameState.userHandHistory.length < patternLen) continue;

                    const pattern = gameState.userHandHistory.slice(-patternLen);
                    const key = `${patternLen}:${pattern.join(',')}`;
                    const nextHands = gameState.ngramTable[key];

                    if (!nextHands) continue;

                    const maxHand = findMaxHand(nextHands);
                    if (!maxHand) continue;

                    const hitCount = nextHands[maxHand];
                    const voteWeight = hitCount * patternLen;
                    votes[maxHand] += voteWeight;
                }
            }

            return findMaxHand(votes);
        }

        function learnFromRound(aiHand, userHand) {
            // Add to user hand history
            gameState.userHandHistory.push(userHand);
            gameState.aiHandHistory.push(aiHand);

            // Update ngram table
            const histLen = gameState.userHandHistory.length;

            // Special case: first hand (no prior context)
            if (histLen === 1) {
                const key = '0:';  // 0-gram: no context
                if (!gameState.ngramTable[key]) {
                    gameState.ngramTable[key] = { ROCK: 0, PAPER: 0, SCISSORS: 0 };
                }
                gameState.ngramTable[key][userHand]++;
            }

            // Regular n-gram learning (for 2nd hand onwards)
            if (histLen >= 2) {
                for (let patternLen = 1; patternLen <= 5; patternLen++) {
                    if (histLen <= patternLen) continue;

                    const pattern = gameState.userHandHistory.slice(histLen - patternLen - 1, histLen - 1);
                    const nextHand = gameState.userHandHistory[histLen - 1];
                    const key = `${patternLen}:${pattern.join(',')}`;

                    if (!gameState.ngramTable[key]) {
                        gameState.ngramTable[key] = { ROCK: 0, PAPER: 0, SCISSORS: 0 };
                    }
                    gameState.ngramTable[key][nextHand]++;
                }
            }

            // Update history dependency
            if (gameState.history.length >= 2) {
                const prevRound = gameState.history[gameState.history.length - 2];
                const prevAI = handToShort(prevRound.aiHand);
                const prevUser = handToShort(prevRound.userHand);
                const key = `${prevAI}_${prevUser}`;

                if (gameState.historyDependency[key]) {
                    gameState.historyDependency[key][userHand]++;
                }
            }
        }

        function determineWinner(aiHand, userHand) {
            if (aiHand === userHand) return 'DRAW';

            if (
                (aiHand === HANDS.ROCK && userHand === HANDS.SCISSORS) ||
                (aiHand === HANDS.PAPER && userHand === HANDS.ROCK) ||
                (aiHand === HANDS.SCISSORS && userHand === HANDS.PAPER)
            ) {
                return 'AI_WIN';
            }

            return 'USER_WIN';
        }

        function randomHand() {
            const hands = [HANDS.ROCK, HANDS.PAPER, HANDS.SCISSORS];
            return hands[Math.floor(Math.random() * hands.length)];
        }

        function getWinningHand(opponentHand) {
            if (opponentHand === HANDS.ROCK) return HANDS.PAPER;
            if (opponentHand === HANDS.PAPER) return HANDS.SCISSORS;
            if (opponentHand === HANDS.SCISSORS) return HANDS.ROCK;
            return randomHand();
        }

        function getNonLosingHand(hand1, hand2) {
            if (hand1 === null) return getWinningHand(hand2);
            if (hand2 === null) return getWinningHand(hand1);
            if (hand1 === hand2) return getWinningHand(hand1);

            const set = new Set([hand1, hand2]);
            if (set.has(HANDS.ROCK) && set.has(HANDS.PAPER)) return HANDS.PAPER;
            if (set.has(HANDS.ROCK) && set.has(HANDS.SCISSORS)) return HANDS.ROCK;
            if (set.has(HANDS.PAPER) && set.has(HANDS.SCISSORS)) return HANDS.SCISSORS;

            return randomHand();
        }

        function findMaxHand(counts) {
            if (!counts) return null;

            let maxCount = 0;
            let maxHand = null;
            let tieCount = 0;

            for (let hand in counts) {
                if (counts[hand] > maxCount) {
                    maxCount = counts[hand];
                    maxHand = hand;
                    tieCount = 1;
                } else if (counts[hand] === maxCount && counts[hand] > 0) {
                    tieCount++;
                }
            }

            if (maxCount === 0 || tieCount > 1) return null;
            return maxHand;
        }

        function handToShort(hand) {
            if (hand === HANDS.ROCK) return 'R';
            if (hand === HANDS.PAPER) return 'P';
            if (hand === HANDS.SCISSORS) return 'S';
            return '';
        }

        // UI Updates
        function updateScores() {
            document.getElementById('aiWins').textContent = gameState.aiWins;
            document.getElementById('userWins').textContent = gameState.userWins;
            document.getElementById('draws').textContent = gameState.draws;

            // Update subtitle if in Hell Mode
            if (gameState.isHellMode) {
                const remaining = HELL_MODE_TARGET - gameState.userWins;
                document.getElementById('gameSubtitle').textContent =
                    `⚠️ ヘルモード！ あと${remaining}勝必要！ ⚠️`;
            }
        }

        function updateButtons(aiHand, userHand) {
            // Clear previous selections
            document.querySelectorAll('.hand-button').forEach(btn => btn.classList.remove('selected'));

            // Highlight AI hand
            if (aiHand === HANDS.ROCK) document.getElementById('aiRock').classList.add('selected');
            if (aiHand === HANDS.PAPER) document.getElementById('aiPaper').classList.add('selected');
            if (aiHand === HANDS.SCISSORS) document.getElementById('aiScissors').classList.add('selected');

            // Highlight User hand
            if (userHand === HANDS.ROCK) document.getElementById('userRock').classList.add('selected');
            if (userHand === HANDS.PAPER) document.getElementById('userPaper').classList.add('selected');
            if (userHand === HANDS.SCISSORS) document.getElementById('userScissors').classList.add('selected');
        }

        function updateAIAvatar(result) {
            const aiAvatar = document.getElementById('aiAvatar');

            if (result === 'AI_WIN') {
                const winEmojis = ['🤭', '🤩', '😍', '🥳', '🥱'];
                const randomEmoji = winEmojis[Math.floor(Math.random() * winEmojis.length)];
                aiAvatar.textContent = randomEmoji; // AI wins: random happy face
            } else if (result === 'USER_WIN') {
                const loseEmojis = ['🤢', '😡', '😩', '😭', '🥺'];
                const randomEmoji = loseEmojis[Math.floor(Math.random() * loseEmojis.length)];
                aiAvatar.textContent = randomEmoji; // AI loses: random sad face
            } else {
                aiAvatar.textContent = '😐'; // Draw: neutral face
            }
        }

        function enterHellMode() {
            gameState.isHellMode = true;

            // Flash effect
            document.body.classList.add('flash-effect');
            setTimeout(() => {
                document.body.classList.remove('flash-effect');

                // Apply Hell Mode color inversion after flash
                document.body.classList.add('hell-mode');

                // Update AI avatar to show intensity
                document.getElementById('aiAvatar').textContent = '👿';

                // Update title to Hell Mode
                document.getElementById('gameTitle').textContent = 'ヘルじゃんけんマンに勝てるかな？';

                // Update subtitle to show Hell Mode
                const remaining = HELL_MODE_TARGET - gameState.userWins;
                document.getElementById('gameSubtitle').textContent =
                    `⚠️ ヘルモード突入！ あと${remaining}勝必要！ ⚠️`;
            }, 450); // After flash animation completes (0.15s × 3 = 0.45s)
        }

        function updateHistoryTable() {
            const tbody = document.getElementById('historyTable');
            tbody.innerHTML = '';

            // Show last 10 rounds in descending order
            const recentHistory = gameState.history.slice(-10).reverse();

            if (recentHistory.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4">まだ対戦履歴がありません</td></tr>';
                return;
            }

            recentHistory.forEach(round => {
                const row = document.createElement('tr');

                const resultText = round.result === 'USER_WIN' ? '勝ち' :
                                  round.result === 'AI_WIN' ? '負け' : 'あいこ';
                const resultClass = round.result === 'USER_WIN' ? 'result-win' :
                                   round.result === 'AI_WIN' ? 'result-lose' : 'result-draw';

                row.innerHTML = `
                    <td>${round.round}</td>
                    <td>${HAND_SYMBOLS[round.aiHand]}</td>
                    <td>${HAND_SYMBOLS[round.userHand]}</td>
                    <td class="${resultClass}">${resultText}</td>
                `;

                tbody.appendChild(row);
            });
        }

        function updateSessionTable() {
            const tbody = document.getElementById('sessionTable');
            tbody.innerHTML = '';

            if (sessionHistory.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4">まだセッション記録がありません</td></tr>';
                updateTotalWinRate();
                return;
            }

            // Show sessions in reverse order (newest first)
            sessionHistory.slice().reverse().forEach(session => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${session.sessionNumber}</td>
                    <td class="result-win">${session.userWins}</td>
                    <td class="result-lose">${session.aiWins}</td>
                    <td class="result-draw">${session.draws}</td>
                `;
                tbody.appendChild(row);
            });

            updateTotalWinRate();
        }

        function updateTotalWinRate() {
            let totalSessionWins = 0;
            let totalSessionLosses = 0;

            sessionHistory.forEach(session => {
                if (session.userWins >= 30) {
                    totalSessionWins++;
                } else if (session.aiWins >= 30) {
                    totalSessionLosses++;
                }
            });

            const totalSessions = totalSessionWins + totalSessionLosses;
            const winRate = totalSessions > 0 ? Math.round((totalSessionWins / totalSessions) * 100) : 0;

            document.getElementById('totalWinRate').textContent = winRate + '%';
            document.getElementById('sessionWins').textContent = totalSessionWins;
            document.getElementById('sessionLosses').textContent = totalSessionLosses;
        }

        function showGameEndModal() {
            const modal = document.getElementById('gameEndModal');
            const title = document.getElementById('modalTitle');
            const message = document.getElementById('modalMessage');

            // Save session to history
            sessionHistory.push({
                sessionNumber: sessionHistory.length + 1,
                userWins: gameState.userWins,
                aiWins: gameState.aiWins,
                draws: gameState.draws
            });

            updateSessionTable();

            if (gameState.userWins >= HELL_MODE_TARGET) {
                title.textContent = 'あなたの勝利！';
                message.textContent = `おめでとうございます！ヘルじゃんけんマンに勝ちました！\n${gameState.userWins}勝 ${gameState.aiWins}敗 ${gameState.draws}引き分けでした。`;
            } else if (gameState.userWins >= HELL_MODE_THRESHOLD) {
                title.textContent = 'ヘルじゃんけんマンの勝利';
                message.textContent = `残念！ヘルじゃんけんマンが勝ちました。\n${gameState.userWins}勝 ${gameState.aiWins}敗 ${gameState.draws}引き分けでした。`;
            } else {
                title.textContent = 'じゃんけんマンの勝利';
                message.textContent = `残念！じゃんけんマンが勝ちました。${gameState.userWins}勝 ${gameState.aiWins}敗 ${gameState.draws}引き分けでした。`;
            }

            document.getElementById('shareStatus').textContent = '';
            document.getElementById('shareText').hidden = true;
            prepareResultShare();
            modal.classList.add('active');
        }

        let resultShare = null;

        function prepareResultShare() {
            const title = 'じゃんけんマンに勝てるかな？';
            const outcome = document.getElementById('modalTitle').textContent;
            const score = `${gameState.userWins}勝 ${gameState.aiWins}敗 ${gameState.draws}引き分け`;
            const url = /^https?:$/.test(location.protocol) ? location.href.split(/[?#]/)[0] : '';
            const result = { title, text: `${title}\n${outcome}\n${score}`, url, file: null };
            resultShare = result;
            try {
                const canvas = document.createElement('canvas');
                canvas.width = 1200;
                canvas.height = 630;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#f0f0f0';
                ctx.fillRect(0, 0, 1200, 630);
                ctx.strokeStyle = '#808080';
                ctx.lineWidth = 4;
                ctx.strokeRect(24, 24, 1152, 582);
                ctx.textAlign = 'center';
                ctx.fillStyle = '#000';
                ctx.font = 'bold 48px sans-serif';
                ctx.fillText(title, 600, 110);
                ctx.font = '100px "Segoe UI Emoji", sans-serif';
                ctx.fillText(document.getElementById('aiAvatar').textContent, 600, 265);
                ctx.font = 'bold 48px sans-serif';
                ctx.fillText(outcome, 600, 370);
                ctx.fillStyle = '#0000aa';
                ctx.font = 'bold 56px sans-serif';
                ctx.fillText(score, 600, 480);
                ctx.fillStyle = '#444';
                ctx.font = '24px sans-serif';
                ctx.fillText(url, 600, 560, 1080);
                canvas.toBlob(blob => {
                    if (blob && typeof File !== 'undefined') {
                        result.file = new File([blob], 'janken-result.png', { type: 'image/png' });
                    }
                }, 'image/png');
            } catch (error) {
                // Text sharing remains available if image generation is unsupported.
            }
        }

        async function shareResult() {
            const result = resultShare;
            if (!result) return;
            const button = document.getElementById('shareButton');
            const status = document.getElementById('shareStatus');
            const text = [result.text, result.url].filter(Boolean).join('\n');
            button.disabled = true;
            status.textContent = '';
            try {
                if (navigator.share) {
                    const data = { title: result.title, text: result.text };
                    if (result.url) data.url = result.url;
                    if (result.file && navigator.canShare && navigator.canShare({ files: [result.file] })) {
                        data.files = [result.file];
                    }
                    await navigator.share(data);
                } else {
                    await navigator.clipboard.writeText(text);
                    status.textContent = '結果をコピーしました。投稿先に貼り付けてください。';
                }
            } catch (error) {
                if (error.name !== 'AbortError') {
                    const field = document.getElementById('shareText');
                    field.value = text;
                    field.hidden = false;
                    field.focus();
                    field.select();
                    status.textContent = '結果のテキストをコピーして共有してください。';
                }
            } finally {
                button.disabled = false;
            }
        }

        function resetGame() {
            resultShare = null;
            gameState = {
                round: 0,
                aiWins: 0,
                userWins: 0,
                draws: 0,
                history: [],
                userHandHistory: [],
                aiHandHistory: [],
                historyDependency: {},
                ngramTable: {},
                nextAIHand: null,
                isHellMode: false
            };

            initHistoryDependency();
            updateScores();
            updateHistoryTable();

            document.querySelectorAll('.hand-button').forEach(btn => btn.classList.remove('selected'));
            document.getElementById('gameEndModal').classList.remove('active');
            document.getElementById('aiAvatar').textContent = '😀';

            // Reset Hell Mode styles
            document.body.classList.remove('hell-mode');
            document.getElementById('gameTitle').textContent = 'じゃんけんマンに勝てるかな？';
            document.getElementById('gameSubtitle').textContent = '30本先取勝負';

            // Prepare first AI hand for new game
            prepareNextAIHand();
        }

        // Keyboard controls
        document.addEventListener('keydown', function(event) {
            // Ignore if game is over
            if (gameState.aiWins >= AI_WIN_THRESHOLD || gameState.userWins >= HELL_MODE_TARGET) return;

            const key = event.key.toLowerCase();

            // 1, 2, 3 keys (position-based)
            if (key === '1') {
                playRound('ROCK');
            } else if (key === '2') {
                playRound('SCISSORS');
            } else if (key === '3') {
                playRound('PAPER');
            }
            // R, P, S keys (hand-based)
            else if (key === 'r') {
                playRound('ROCK');
            } else if (key === 'p') {
                playRound('PAPER');
            } else if (key === 's') {
                playRound('SCISSORS');
            }
        });

        // Initialize on page load
        window.onload = initGame;
    </script>
</body>
</html>
